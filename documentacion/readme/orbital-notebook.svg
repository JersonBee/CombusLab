<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title description">
  <title id="title">CombusLab orbital notebook</title>
  <desc id="description">Night-blue notebook paper with a cyan pixel flame, orbital paths, and amber sparks.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#526984" stroke-opacity=".22"/>
    </pattern>
    <radialGradient id="glow">
      <stop stop-color="#1B2A42"/>
      <stop offset="1" stop-color="#080F1F"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="1118" height="338" rx="24" fill="url(#glow)" stroke="#526984" stroke-width="2"/>
  <rect x="21" y="21" width="1078" height="298" rx="14" fill="url(#paper)" stroke="#526984" stroke-opacity=".5"/>
  <path d="M56 21V319M68 21V319" stroke="#82A7FF" opacity=".35"/>
